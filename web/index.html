<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Emotion Interpreter — Consent-First Reflection Dashboard</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 28px; }
    .card { max-width: 780px; margin: 0 auto 20px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    .notice { border-left: 4px solid #38bdf8; padding-left: 12px; color: #cbd5e1; font-size: 14px; }
    button { background: #0284c7; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <section class="card" id="consent-gate">
    <h1>Local Multimodal Reflection Studio</h1>
    <p class="notice">
      <strong>EU AI Act Art. 5(1)(f) Notice:</strong> All webcam &amp; microphone processing stays local in your browser.
      This tool presents tentative observable cues and alternative explanations for self-reflection only — never hiring, school grading, or surveillance verdicts.
    </p>
    <label><input type="checkbox" id="consent-checkbox" /> I give explicit consent to analyze local signals for self-reflection.</label>
    <br /><br />
    <button id="start-btn" disabled>Enable Local Reflection Dashboard</button>
  </section>
  <script>
    const cb = document.getElementById("consent-checkbox");
    const btn = document.getElementById("start-btn");
    cb.addEventListener("change", () => { btn.disabled = !cb.checked; });
  </script>
</body>
</html>
